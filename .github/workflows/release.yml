name: Build And Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Compute release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      android_version_code: ${{ steps.version.outputs.android_version_code }}
    steps:
      - name: Compute version
        id: version
        run: |
          build_number=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          version="0.1.${build_number}"
          {
            echo "version=${version}"
            echo "tag=v${version}"
            echo "android_version_code=${build_number}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build desktop packages
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            cmd: npm run dist:win
          - os: ubuntu-latest
            name: linux
            cmd: npm run dist:linux
          - os: macos-latest
            name: macos
            cmd: npm run dist:mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Set package version
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version

      - name: Build distributables
        run: ${{ matrix.cmd }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            release/*Setup*.exe
            release/*Setup*.exe.blockmap
            release/**/*.AppImage
            release/**/*.deb
            release/**/*.dmg
          if-no-files-found: warn

  android:
    name: Build Android APK
    needs: version
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Android/app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install JavaScript dependencies
        working-directory: Android/app
        run: npm ci

      - name: Run lint
        working-directory: Android/app
        run: npm run lint

      - name: Run tests
        working-directory: Android/app
        run: npm test -- --runInBand

      - name: Run TypeScript check
        working-directory: Android/app
        run: npx tsc --noEmit

      - name: Build release APK
        working-directory: Android/app/android
        run: ./gradlew assembleRelease -PVERSION_CODE=${{ needs.version.outputs.android_version_code }} -PVERSION_NAME=${{ needs.version.outputs.version }}

      - name: Verify release APK contains JS bundle
        run: unzip -l Android/app/android/app/build/outputs/apk/release/app-release.apk | grep 'assets/index.android.bundle'

      - name: Prepare APK artifact
        run: |
          mkdir -p artifacts
          cp Android/app/android/app/build/outputs/apk/release/app-release.apk artifacts/YMusicPlayerAndroid-${{ needs.version.outputs.version }}-release.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: artifacts/*-release.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - version
      - build
      - android
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: YMusicPlayer ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/**/*.apk
            artifacts/**/*.deb
            artifacts/**/*.exe
            artifacts/**/*.exe.blockmap
            artifacts/**/*.AppImage
            artifacts/**/*.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
